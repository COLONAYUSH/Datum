name: Publish to PyPI

# Publishes on version tags (v0.1.0, v0.2.0, ...). Uses PyPI Trusted
# Publishing (OIDC) — no API token stored in the repo. One-time setup on
# pypi.org: Project -> Settings -> Publishing -> add this repository,
# workflow "publish.yaml", environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-pushed tag (e.g. after a history rewrite) re-fires this
          # workflow for a version PyPI already has. PyPI permanently refuses
          # duplicate files, which is correct, but it should read as a no-op
          # here, not a failure email.
          skip-existing: true
