name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + dev (no ML extras)
        run: pip install -e ".[dev]"
      - name: Run the suite
        # ML-dependent tests (embedder, reranker, Docling, OCR) skip themselves
        # when the extras are absent — by design, loudly, never silently. The
        # core contract surface (kernel, storage, groundstore, writepath,
        # conformance gate, planner fusion, MCP scaffold, HTTP surface) runs
        # in full against the real pgvector Postgres above.
        env:
          DATUM_PG_DSN: postgresql://datum:datum@localhost:5432/datum_ci
        run: python -m pytest -q
